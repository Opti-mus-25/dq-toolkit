[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dqkit"
version = "0.1.0"
description = "Rules-driven data quality checker for research-style data (synthetic demo)"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2", "PyYAML>=6.0", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
