dataset: Synthetic ADRC-style research data (practice dataset, no real participants)
version: 1

date_formats:
  - "%Y-%m-%d"
  - "%m/%d/%Y"

tables:
  participants:
    file: participants.csv
    form: Participant Enrollment
    key: participant_id
    fields:
      participant_id:
        label: Participant ID
        type: string
        required: true
        pattern: '^P\d{4}$'
      birth_date:
        label: Date of birth
        type: date
        required: true
        min: '1925-01-01'
        max: '1960-12-31'
      sex:
        label: Sex
        type: category
        required: true
        allowed: [F, M]
        choices: "F, Female | M, Male"
        label_map: {f: F, female: F, m: M, male: M}
      education_years:
        label: Years of education
        type: int
        required: true
        min: 0
        max: 25
      enrollment_date:
        label: Enrollment date
        type: date
        required: true
        min: '2015-01-01'
        max: '2024-12-31'

  visits:
    file: visits.csv
    form: Study Visit
    key: visit_id
    fields:
      visit_id:
        label: Visit ID
        type: string
        required: true
        pattern: '^V\d{5}$'
      participant_id:
        label: Participant ID
        type: string
        required: true
        pattern: '^P\d{4}$'
      visit_date:
        label: Visit date
        type: date
        required: true
        min: '2015-01-01'
        max: '2026-12-31'
      visit_number:
        label: Visit number
        type: int
        required: true
        min: 1
        max: 6

  cognitive_scores:
    file: cognitive_scores.csv
    form: Cognitive Screen
    key: visit_id
    fields:
      visit_id:
        label: Visit ID
        type: string
        required: true
        pattern: '^V\d{5}$'
      participant_id:
        label: Participant ID
        type: string
        required: true
        pattern: '^P\d{4}$'
      orientation:
        label: Orientation (0-10)
        type: int
        required: true
        min: 0
        max: 10
      registration:
        label: Registration (0-3)
        type: int
        required: true
        min: 0
        max: 3
      attention:
        label: Attention (0-5)
        type: int
        required: true
        min: 0
        max: 5
      recall:
        label: Recall (0-3)
        type: int
        required: true
        min: 0
        max: 3
      language:
        label: Language (0-9)
        type: int
        required: true
        min: 0
        max: 9
      total_reported:
        label: Total score as entered (0-30)
        type: int
        required: true
        min: 0
        max: 30

  clinical_participants:
    file: clinical_participants.csv
    form: Clinical Database Demographics
    key: participant_id
    fields:
      participant_id:
        label: Participant ID
        type: string
        required: true
        pattern: '^P\d{4}$'
      birth_date:
        label: Date of birth
        type: date
        required: true
        min: '1925-01-01'
        max: '1960-12-31'
      sex:
        label: Sex
        type: category
        required: true
        allowed: [F, M]
        label_map: {f: F, female: F, m: M, male: M}

computed_totals:
  - table: cognitive_scores
    total_field: total_reported
    item_fields: [orientation, registration, attention, recall, language]

foreign_keys:
  - {table: visits, field: participant_id, ref_table: participants, ref_field: participant_id}
  - {table: cognitive_scores, field: visit_id, ref_table: visits, ref_field: visit_id}
  - {table: cognitive_scores, field: participant_id, ref_table: participants, ref_field: participant_id}

categories:
  label_standardized:
    description: Label variant standardized to the approved value
    severity: low
    route_to: None (auto-fixed and logged)
  date_format_standardized:
    description: Date converted to YYYY-MM-DD
    severity: low
    route_to: None (auto-fixed and logged)
  duplicate_removed:
    description: Exact duplicate row removed
    severity: low
    route_to: None (auto-fixed and logged)
  missing_column:
    description: A column listed in the rules is not in the file
    severity: high
    route_to: Data Services
  missing_required:
    description: Required field is empty
    severity: high
    route_to: Clinical Core study coordinator
  invalid_type:
    description: Value is not the expected type
    severity: high
    route_to: Clinical Core study coordinator
  invalid_format:
    description: Value does not match the expected pattern
    severity: medium
    route_to: Data Services
  invalid_category:
    description: Value is not in the allowed list
    severity: medium
    route_to: Clinical Core study coordinator
  out_of_range:
    description: Value is outside the allowed range
    severity: high
    route_to: Clinical Core study coordinator
  duplicate_conflict:
    description: Same key appears more than once with different values
    severity: high
    route_to: Data Services
  total_score_mismatch:
    description: Reported total does not equal the sum of the item scores
    severity: high
    route_to: Clinical Core study coordinator
  orphan_record:
    description: Record refers to an ID that does not exist in the parent table
    severity: high
    route_to: Data Services
  visit_before_enrollment:
    description: Visit date is earlier than the enrollment date
    severity: high
    route_to: Clinical Core study coordinator
  cross_db_birth_date_mismatch:
    description: Date of birth differs between the research and clinical databases
    severity: high
    route_to: Data Services (cross-database)
  cross_db_sex_mismatch:
    description: Sex differs between the research and clinical databases
    severity: high
    route_to: Data Services (cross-database)
  cross_db_missing_participant:
    description: Participant is in the research database but not the clinical database
    severity: high
    route_to: Data Services (cross-database)
  cross_db_extra_participant:
    description: Participant is in the clinical database but not the research database
    severity: medium
    route_to: Data Services (cross-database)
